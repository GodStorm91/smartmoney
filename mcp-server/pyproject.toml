[project]
name = "smartmoney-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing SmartMoney finance data to OpenClaw over streamable-http"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3.0",
    "httpx>=0.27.0",
]

[project.scripts]
smartmoney-mcp = "smartmoney_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartmoney_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
