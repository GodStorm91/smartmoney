[project]
name = "smartmoney-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing SmartMoney finance data to OpenClaw over streamable-http"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3.0",
    "httpx>=0.27.0",
]

[project.scripts]
smartmoney-mcp = "smartmoney_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartmoney_mcp"]
